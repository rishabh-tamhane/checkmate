[project]
name = "checkmate"
version = "0.1.0"
description = "Split a restaurant receipt by the items each person consumed."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
    { name = "Rishabh Tamhane" },
]
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openai>=3.3.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.3",
]

[project.scripts]
checkmate-web = "checkmate.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.11.32"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=checkmate",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
markers = [
    "external: opt-in evaluation that makes paid OpenAI API calls",
]
testpaths = ["tests"]
