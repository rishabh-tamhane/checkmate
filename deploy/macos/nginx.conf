limit_conn_zone $server_name zone=checkmate_connections:1m;
limit_req_zone $server_name zone=checkmate_requests:1m rate=20r/s;

upstream checkmate_app {
    server app:8000;
    keepalive 8;
}

server {
    listen 8080 default_server;
    server_name _;
    access_log off;
    server_tokens off;
    return 421;
}

server {
    listen 8080;
    server_name checkmate.rishabhtamhane.com;

    access_log off;
    server_tokens off;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_conn checkmate_connections 32;
    limit_req zone=checkmate_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn_status 503;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering on;

    location = /api/receipts/extract {
        client_max_body_size 11m;
        proxy_pass http://checkmate_app;
    }

    location = /api/splits/calculate {
        client_max_body_size 256k;
        proxy_pass http://checkmate_app;
    }

    location = /api/splits/pdf {
        client_max_body_size 256k;
        proxy_pass http://checkmate_app;
    }

    location / {
        client_max_body_size 1k;
        proxy_pass http://checkmate_app;
    }
}
